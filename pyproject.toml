[project]
name = "terminal-kitten"
version = "1.0.0"
description = "A tiny interactive ASCII kitten that lives in your terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Aditya Wanve" }]
keywords = ["terminal", "ascii", "kitten", "cli", "tamagotchi", "nya"]
dependencies = []

[project.urls]
Homepage = "https://github.com/aditya4f/Nya-theKitten"
Repository = "https://github.com/aditya4f/Nya-theKitten"

[project.scripts]
kitten = "kitten.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
